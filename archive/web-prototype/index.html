<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LXTool · 游戏制作工具架</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101319;color:#e4e9f2;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}aside{position:fixed;width:220px;inset:0 auto 0 0;background:#171c25;padding:32px 22px;border-right:1px solid #2a3240}h1{font-size:28px;letter-spacing:1px;margin:0 0 6px}small,.muted{color:#92a1b9}nav{display:grid;gap:10px;margin-top:40px}button,select,input{font:inherit;border:1px solid #354155;border-radius:8px;padding:10px 14px;background:#212a38;color:#e4e9f2}button{cursor:pointer}button:hover{background:#33435b}button:disabled{opacity:.45;cursor:wait}.primary{background:#3869d8;border-color:#477cec}main{margin-left:220px;padding:38px;max-width:1400px}header{display:flex;justify-content:space-between;align-items:center}h2{font-size:25px;margin:0 0 10px}.panel{background:#191f2a;border:1px solid #2b3545;border-radius:14px;padding:24px;margin-top:24px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}input{min-width:250px}#tools{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:24px}.card{background:#1a2230;border:1px solid #354159;border-radius:12px;padding:22px;cursor:pointer}.card.selected{border-color:#6a94fa}.badge{font-size:12px;color:#a6c3ff}h3{overflow-wrap:anywhere}.version{padding:14px 0;border-bottom:1px solid #303b4e}.notice{line-height:1.8;color:#aebcd2}#status{min-height:24px;color:#9dc0ff;margin-top:18px}.empty{padding:40px;text-align:center;color:#97a7c0}footer{margin-top:30px;font-size:12px;color:#8393aa}@media(max-width:800px){aside{position:static;width:auto}nav{display:flex;margin-top:16px}main{margin:0;padding:22px}}
</style>
<aside><h1>LXTool<span style="color:#78a2ff">.</span></h1><small>GAME PRODUCTION HUB</small><nav><button onclick="filterBy('全部')">全部工具</button><button onclick="filterBy('3ds Max')">3ds Max</button><button onclick="filterBy('Unity')">Unity</button><button onclick="filterBy('通用工具')">通用工具</button></nav><p class="notice">Windows 原型<br>GitHub 工具分发与版本管理</p></aside>
<main><header><div><h2>我的工具架</h2><span class="muted">集中获取制作工具，保留每一个可用版本。</span></div><span class="badge">LOCAL PREVIEW · 0.1</span></header>
<section class="panel"><div class="row"><input id="repo" class="grow" placeholder="GitHub 仓库：owner/repo"><select id="category"><option>3ds Max</option><option>Unity</option><option>通用工具</option></select><button class="primary" onclick="addTool()">添加工具仓库</button></div></section>
<div id="status" role="status"></div><div id="tools"></div>
<section id="detail" class="panel" hidden><div class="row"><h2 id="title" class="grow"></h2><button onclick="loadReleases()">检查更新 / 查看版本</button></div><p class="notice">仅处理 GitHub Release 中的 ZIP 包，不自动执行工具。启用版本只记录本地选择，尚未连接 3ds Max 或 Unity 项目。</p><div class="row"><input id="token" type="password" autocomplete="off" placeholder="私有仓库访问令牌（仅本次运行）"><button onclick="authenticate()">应用凭据</button><span id="authState" class="muted"></span></div><h3>已安装版本</h3><div id="installed"></div><h3>远端发布版本</h3><div id="releases" class="muted">点击“检查更新 / 查看版本”获取。</div></section>
<footer id="footer"></footer></main>
<script>
const sessionKey=location.hash.slice(1);history.replaceState(null,'',location.pathname);let state={tools:[]},selected=null,filter='全部';
const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,data={}){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-LXTool-Key':sessionKey},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
async function work(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);el('status').textContent='正在处理，请稍候…';try{await fn();el('status').textContent='操作完成'}catch(e){el('status').textContent=e.message}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function refresh(){state=await api('state');render()}
function filterBy(v){filter=v;render()}
function render(){el('tools').innerHTML=state.tools.filter(t=>filter==='全部'||t.category===filter).map(t=>`<article class="card ${selected===t.id?'selected':''}" onclick="choose('${t.id}')"><span class="badge">${esc(t.category)}</span><h3>${esc(t.repo)}</h3><span class="muted">${t.versions.length} 个本地版本 · ${t.active?'已选择启用版本':'尚未启用'}</span></article>`).join('')||'<div class="empty">这里还没有工具。添加一个 GitHub 仓库开始。<br><br>工具需要通过 Release 发布 ZIP 附件。</div>';el('footer').textContent='数据保存在本机：'+state.dataPath;const t=state.tools.find(t=>t.id===selected);el('detail').hidden=!t;if(!t)return;el('title').textContent=t.repo;el('authState').textContent=state.authenticated.includes(t.id)?'已设置本次运行凭据':'匿名访问';el('installed').innerHTML=t.versions.map(v=>`<div class="version row"><span class="grow">${esc(v.tag)} · ${esc(v.name)}<br><small>${v.verified?'已核对 GitHub SHA-256':'仅记录本地 SHA-256，远端未提供校验值'}</small></span><button onclick="activate('${v.key}')">${t.active===v.key?'当前启用':'启用版本'}</button><button onclick="openFolder('${v.key}')">打开目录</button></div>`).join('')||'<p class="muted">暂无已安装版本。</p>'}
function choose(id){selected=id;el('token').value='';el('releases').textContent='点击“检查更新 / 查看版本”获取。';render()}
function addTool(){work(async()=>{await api('add',{repo:el('repo').value,category:el('category').value});el('repo').value='';await refresh()})}
function authenticate(){work(async()=>{await api('auth',{id:selected,token:el('token').value});el('token').value='';await refresh()})}
function loadReleases(){work(async()=>{const releases=await api('releases',{id:selected});el('releases').innerHTML=releases.map(r=>`<div class="version"><strong>${esc(r.tag)} ${r.prerelease?'· 预发布':''}</strong>${r.assets.map(a=>`<div class="row version"><span class="grow">${esc(a.name)} · ${(a.size/1048576).toFixed(1)} MB</span><button onclick="install(${a.id})">下载此版本</button></div>`).join('')||'<p>此版本没有 ZIP 附件。</p>'}</div>`).join('')||'没有可用的 Release。'})}
function install(asset){work(async()=>{await api('install',{id:selected,asset});await refresh()})}
function activate(key){work(async()=>{await api('activate',{id:selected,key});await refresh()})}
function openFolder(key){work(()=>api('open',{id:selected,key}))}
work(refresh);
</script></html>
